<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>وكالة المنسى - نظام الفواتير</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f6f5;--card:#fff;--ink:#12343b;--mut:#5d7177;--line:#dbe3e1;--acc:#12343b;--onacc:#fff;--ok:#2f7d4f;--okbg:#e3f2e8;--warn:#a8650d;--warnbg:#fbeed6;--bad:#b3402f;--badbg:#f8e1dc;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1a1d;--card:#16262a;--ink:#e6efee;--mut:#93a8ad;--line:#27393d;--acc:#5fb7a6;--onacc:#0e1a1d;--ok:#6fcf93;--okbg:#17332437;--warn:#e8b25c;--warnbg:#3a2d12;--bad:#ef8c7c;--badbg:#3b1d19}}
:root[data-theme="dark"]{--bg:#0e1a1d;--card:#16262a;--ink:#e6efee;--mut:#93a8ad;--line:#27393d;--acc:#5fb7a6;--onacc:#0e1a1d;--ok:#6fcf93;--okbg:#17332437;--warn:#e8b25c;--warnbg:#3a2d12;--bad:#ef8c7c;--badbg:#3b1d19}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic",Tahoma,Arial,sans-serif;line-height:1.6}
main{max-width:860px;margin:0 auto;padding:16px 14px 90px}
h1{font-size:20px;margin:0}h2{font-size:17px;margin:0 0 10px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.logo{width:36px;height:36px;border-radius:9px;background:var(--acc);color:var(--onacc);display:grid;place-items:center;font-weight:700}
nav{position:fixed;bottom:0;inset-inline:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
nav button{flex:1;border:0;background:none;color:var(--mut);font:inherit;font-size:12px;padding:8px 4px;border-radius:8px}
nav button.on{color:var(--acc);font-weight:700;background:var(--bg)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px}
.stat small{color:var(--mut);display:block;font-size:12px}.stat b{font-size:17px}
.stat.rem b{color:var(--bad)}.stat.ok b{color:var(--ok)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}.row.click{cursor:pointer}
.sub{color:var(--mut);font-size:13px}
.tag{font-size:12px;padding:2px 9px;border-radius:20px;white-space:nowrap}
.t-ok{background:var(--okbg);color:var(--ok)}.t-part{background:var(--warnbg);color:var(--warn)}.t-bad{background:var(--badbg);color:var(--bad)}
label{display:block;font-size:13px;color:var(--mut);margin:8px 0 3px}
input,select{width:100%;font:inherit;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.btn{font:inherit;border:0;border-radius:9px;padding:10px 14px;background:var(--acc);color:var(--onacc);font-weight:500;cursor:pointer}
.btn.sec{background:none;color:var(--acc);border:1px solid var(--acc)}
.btn.wa{background:#1f8f4e;color:#fff}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.item{display:grid;grid-template-columns:2fr 1fr 1fr;gap:6px;margin-bottom:6px}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:start;padding:8px 6px;border-bottom:1px solid var(--line)}th{color:var(--mut);font-weight:500;font-size:13px}
.doc h2{font-size:22px}.sum{margin-inline-start:auto;max-width:260px;margin-top:10px}
.sum div{display:flex;justify-content:space-between;padding:4px 0}
.sum .due{border-top:2px solid var(--ink);margin-top:4px;padding-top:8px;font-weight:700;font-size:18px;color:var(--bad)}
.sum .due.z{color:var(--ok)}
.banner{background:var(--warnbg);color:var(--warn);border-radius:10px;padding:12px;margin-bottom:12px}
.empty{color:var(--mut);text-align:center;padding:18px 0}
.back{background:none;border:0;color:var(--acc);font:inherit;padding:0;margin-bottom:10px;cursor:pointer}
.paper{background:#fff;color:#12343b;border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:12px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.paper .sub{color:#5d7177}.paper .ph{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding-bottom:12px;border-bottom:3px solid #12343b;margin-bottom:14px}
.paper .ph>div:first-child{border:0!important;margin:0!important;padding:0!important}
.paper .big{font-size:26px;font-weight:700}
.paper .bt{display:flex;justify-content:space-between;gap:10px;margin-bottom:12px;padding:10px;background:#f1f5f4;border-radius:8px}
.paper th{background:#12343b;color:#fff;font-weight:500}.paper td{border-bottom:1px solid #dbe3e1}
.paper .sec{font-weight:700;margin:16px 0 6px}
.paper .tot{margin-inline-start:auto;max-width:280px;margin-top:8px}.paper .tot div{display:flex;justify-content:space-between;padding:3px 0}
.paper .due2{display:flex;justify-content:space-between;align-items:center;margin-top:12px;padding:12px;border-radius:8px;background:#12343b;color:#fff;font-size:18px;font-weight:700}
.toast{position:fixed;bottom:84px;inset-inline:14px;margin:auto;max-width:420px;background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:10px;z-index:9;text-align:center}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20;display:grid;place-items:center;padding:14px}.ovb{background:var(--card);border-radius:14px;padding:16px;max-width:460px;width:100%;max-height:90vh;overflow:auto}
textarea{width:100%;font:inherit;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}a.btn{text-decoration:none;display:inline-block}.toast{z-index:30}
:root{--bg:#eef1f5;--ink:#0b263d;--acc:#0b263d;--mut:#5b6b7d;--line:#d6dde6}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1624;--card:#122238;--ink:#e8eef6;--acc:#8fb3dd;--onacc:#0b1624;--mut:#9db0c6;--line:#243a56}}
:root[data-theme="dark"]{--bg:#0b1624;--card:#122238;--ink:#e8eef6;--acc:#8fb3dd;--onacc:#0b1624;--mut:#9db0c6;--line:#243a56}
body{background-image:radial-gradient(circle,rgba(11,38,61,.13) 1px,transparent 1.6px);background-size:14px 14px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) body{background-image:radial-gradient(circle,rgba(255,255,255,.07) 1px,transparent 1.6px)}:root:not([data-theme="light"]) .top{background:#12304f}}
:root[data-theme="dark"] body{background-image:radial-gradient(circle,rgba(255,255,255,.07) 1px,transparent 1.6px)}:root[data-theme="dark"] .top{background:#12304f}
.top{position:relative;overflow:hidden;background:#0b263d;color:#fff;border-radius:18px;padding:14px 16px}
.top::before{pointer-events:none;content:"";position:absolute;inset-inline-end:-46px;top:-64px;width:170px;height:170px;border-radius:50%;border:20px solid rgba(255,255,255,.11);border-bottom-color:transparent;border-inline-start-color:transparent;transform:rotate(-20deg)}
.top h1{color:#fff;font-size:17px;line-height:1.35;position:relative}.top>*{position:relative;z-index:1}.top .sub{color:rgba(255,255,255,.78);position:relative}
.lg{width:54px;height:54px;border-radius:12px;background:#fff;overflow:hidden;flex:none;position:relative}.lg img{width:100%;height:100%;object-fit:cover;display:block}
.paper{color:#0b263d}.paper th,.paper .due2{background:#0b263d}.paper .ph{border-bottom-color:#0b263d}.paper .bt{background:#eef2f7}.paper .blg{width:56px;height:56px;border-radius:10px;object-fit:cover}
.nav-dummy{}
.sh{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;border-inline-start:4px solid var(--acc);cursor:pointer}
.kpi small{color:var(--mut);display:block;font-size:12px}.kpi b{font-size:19px}.kpi.g{border-inline-start-color:#2f7d4f}.kpi.r{border-inline-start-color:#b3402f}.kpi.o{border-inline-start-color:#c98a1b}
.chips{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;padding-bottom:4px}.chip{white-space:nowrap;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:20px;padding:7px 14px;font:inherit;font-size:13px;cursor:pointer}.chip.on{background:var(--acc);color:var(--onacc);border-color:var(--acc)}
.lgd{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin-top:6px}.lgd i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:5px}
.paper tr:nth-child(even) td{background:#f4f7fa}.paper td,.paper th{white-space:nowrap}.paper svg{color:#5b6b7d!important}.paper tr.lk{cursor:pointer}.paper tr.lk td:nth-child(2){color:#0b4f8a;text-decoration:underline}.paper tr.lk:hover td{background:#e3edf7}.paper .lgd{color:#5b6b7d}
nav i{display:block;font-style:normal;font-size:17px}@media(max-width:600px){nav button{font-size:11px;padding:8px 1px}}
@media(min-width:900px){nav{inset:0 0 0 auto;width:200px;flex-direction:column;gap:4px;padding:96px 10px 10px;border-top:0;border-inline-start:1px solid var(--line)}nav button{text-align:start;font-size:14px;padding:11px 12px}nav i{display:inline;margin-inline-end:8px}body{padding-inline-start:200px}main{max-width:1100px;padding-bottom:30px}}
@media print{nav,.noprint,.top,.back{display:none!important}body{padding:0}body,html{background:#fff;color:#000}.card{border:0}.paper{border:0;padding:0}}
.locked main,.locked nav{visibility:hidden}
.ov.login{background:radial-gradient(circle at 20% 10%,#14406a,#0b263d)}.ov.login .ovb{max-width:380px}.lgi{width:104px;height:104px;border-radius:22px;background:#fff;display:block;margin:0 auto 10px;object-fit:cover}.lbn{text-align:center;font-weight:700;font-size:17px;margin-bottom:6px}
.top::before{pointer-events:none}.top span,.top button{position:relative;z-index:2}
</style>

function SP(){return S.sp||(S.sp=[])}
function BL(){return S.bl||(S.bl=[])}
function SO(){return S.so||(S.so=[])}
function spName(id){var s=SP().find(function(x){return x.id===id});return s?s.name:'—'}
function byDate(a,b){return a.date<b.date?-1:a.date>b.date?1:a.id-b.id}
function cliBal(cid){var r=0;S.i.forEach(function(i){if(i.cid===cid)r+=rem(i)});return r}
function supBal(sid){var r=0;BL().forEach(function(b){if(b.sid===sid)r+=rem(b)});return r}
function supTot(){var r=0;BL().forEach(function(b){r+=rem(b)});return r}
function alloc(list,a,mk){list.forEach(function(x){if(a<=0.005)return;var r=rem(x);if(r<=0.005)return;var t=Math.round(Math.min(r,a)*100)/100;x.pay.push(mk(t));a-=t})}
var CS='c';

function vSupp(){var h='<div class="card"><h2>إضافة مورد</h2><label>الاسم</label><input id="sn"><div class="g2"><div><label>الهاتف</label><input id="sph" inputmode="tel"></div><div><label>البريد الإلكتروني</label><input id="se" type="email" dir="ltr"></div></div><label>مرتبط بعميل (لتسهيل المقاصة)</label><select id="sc2"><option value="0">— بدون —</option>'+S.c.map(function(c){return'<option value="'+c.id+'">'+esc(c.name)+'</option>'}).join('')+'</select><label>رصيد افتتاحي (اختياري)</label><input id="sob" type="number" min="0" inputmode="decimal"><div class="actions"><button class="btn" onclick="addSup()">حفظ المورد</button></div></div><div class="card"><h2>الموردين</h2><div class="sub" style="margin-bottom:6px">اضغطي على المورد لعرض كشف حسابه.</div>';
 if(!SP().length)h+='<div class="empty">لا يوجد موردين بعد.</div>';

function addSup(){var n=$('sn').value.trim();if(!n){$('sn').focus();return}SP().push({id:Date.now(),name:n,phone:$('sph').value.trim(),email:$('se').value.trim(),cid:+$('sc2').value||0});save();draw()}
function supRows(sid){var ev=[];BL().forEach(function(b){if(b.sid!==sid)return;ev.push({d:b.date,o:0,t:'فاتورة '+b.no+(b.items[0]&&b.items[0].d?' - '+b.items[0].d:''),cr:tot(b),dr:0});b.pay.forEach(function(p){ev.push({d:p.date,o:1,t:'دفعة على '+b.no+(accName(p.ac)?' ('+accName(p.ac)+')':''),cr:0,dr:p.a})})});
 ev.sort(function(a,b){return a.d<b.d?-1:a.d>b.d?1:a.o-b.o});var r=0;ev.forEach(function(e){r+=e.cr-e.dr;e.b=r});return{ev:ev,b:r}}
function vSst(){var s=SP().find(function(x){return x.id===V.id});if(!s)return'';var R=supRows(s.id),cr=0,dr=0,pb=supBal(s.id);R.ev.forEach(function(e){cr+=e.cr;dr+=e.dr});
 var h='<button class="back" onclick="CS=\'s\';go(\'cli\')">‹ رجوع</button><div class="paper doc"><div class="ph">'+brand()+'<div style="text-align:end"><div class="big">كشف حساب مورد</div><div class="sub">'+today()+'</div></div></div><div class="bt"><div><div class="sub">المورد</div><b>'+esc(s.name)+'</b><div class="sub">'+esc(s.phone||'')+' '+esc(s.email||'')+'</div></div></div>';

function approveMonth(m,ids){if(!canCalc(m))return toast('هذا الشهر قبل بداية الرواتب ('+S.pst+').');if(pmo(m)==='l')return toast('الشهر مقفل.');if(!ids.length)return toast('اختاري موظفًا واحدًا على الأقل.');ids.forEach(function(id){genPay0(m,false,id,1)});(S.pmo||(S.pmo={}))[m]='o';PA=0;save();draw();toast('تم اعتماد رواتب '+m)}
function doApprove(){var ids=[].slice.call(document.querySelectorAll('.pe')).filter(function(x){return x.checked}).map(function(x){return +x.value});if(!ids.length)return toast('اختاري موظفًا واحدًا على الأقل.');if(!cf(-9,'اضغطي «اعتماد» مرة أخرى لإنشاء التزام الرواتب لشهر '+HM))return;approveMonth(HM,ids)}
function lockPay(m){if(!cf(-10,'اضغطي مرة أخرى لقفل رواتب '+m))return;(S.pmo||(S.pmo={}))[m]='l';save();draw();toast('تم قفل رواتب '+m)}
function unlockPay(m){if(!cf(-11,'اضغطي مرة أخرى لفتح قفل '+m))return;S.pmo[m]='o';save();draw();toast('تم فتح القفل')}
function setPst(){if(!cf(-8,'اضغطي مرة أخرى لجعل '+HM+' بداية الرواتب (لن يُسمح بحساب شهور قبله)'))return;S.pst=HM;save();draw();toast('تم تحديد بداية الرواتب')}
function vPayAppr(){var el=EM().filter(function(e){return e.active!==0&&!PR().some(function(r){return r.eid===e.id&&r.m===HM})});
 var h='<div class="card noprint"><h2>اعتماد رواتب شهر '+HM+'</h2><div class="sub">اختاري الموظفين اللي يتحسب لهم راتب في هذا الشهر. الاعتماد بينشئ التزام راتب لكل موظف تختاريه.</div>';
 if(!el.length)h+='<div class="empty">كل الموظفين لهم راتب في هذا الشهر.</div>';
 el.forEach(function(e){h+='<label style="display:flex;gap:8px;align-items:center;margin:8px 0"><input type="checkbox" class="pe" value="'+e.id+'" style="width:auto"'+(startM(e)<=HM?' checked':'')+'> '+esc(e.name)+' <span class="sub">('+M(+e.sal||0)+')</span></label>'});
 return h+'<div class="actions">'+(el.length?'<button class="btn" onclick="doApprove()">اعتماد الرواتب</button>':'')+'<button class="btn sec" onclick="PA=0;draw()">إغلاق</button></div></div>'}
function payBtns(rs){if(!canCalc(HM))return'<span class="sub">قبل بداية الرواتب ('+S.pst+') — غير مسموح</span>';if(pmo(HM)==='l')return'<button class="btn sec" onclick="unlockPay(HM)">فتح قفل الشهر</button>';
 return'<div class="actions" style="margin:0"><button class="btn" onclick="PA=1;draw()">'+(rs.length?'إضافة موظفين':'اعتماد رواتب الشهر')+'</button>'+(rs.length?'<button class="btn sec" onclick="genPay(HM)">تحديث</button><button class="btn sec" onclick="lockPay(HM)">قفل الشهر</button>':'')+'</div>'}
function payStat(rs){var l=pmo(HM)==='l';return'<div class="sub" style="margin-top:10px">الحالة: <b>'+(l?'مقفل':rs.length?'معتمد':'غير معتمد')+'</b> · بداية الرواتب: <b>'+(S.pst||'غير محددة')+'</b> <button class="chip" onclick="setPst()">اجعل '+HM+' البداية</button></div>'}
function addDep(){var a=+$('dpm').value;if(!(a>0))return toast('أدخلي المبلغ.');TR().push({id:Date.now(),date:$('dpd').value||today(),f:0,t:+$('dpa').value,a:a,n:$('dpn').value.trim()});save();draw();toast('تم تسجيل الإيداع')}
function empBal(e){var rs=PR().filter(function(x){return x.eid===e.id}).sort(function(a,b){return a.m<b.m?-1:1});return rs.length?rm(rs[rs.length-1]):(+e.open||0)}
function purgeOrphans(){var n=PR().filter(function(r){return !emp(r.eid)}).length;if(!n)return;if(!delOk(-7))return;S.pr=PR().filter(function(r){return emp(r.eid)});S.hr=HR().filter(function(h){return emp(h.eid)});S.ln=LN().filter(function(l){return emp(l.eid)});save();draw();toast('تم حذف '+n+' سجل')}
var _pr=window.print;
window.print=function(){var d=document.querySelector('.doc');if(!d)return;
 var html='<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>'+esc(document.title)+'</title><style>'+document.querySelector('style').textContent+'body,html{background:#fff!important;color:#000}main{padding-bottom:20px}</style></head><body><main>'+d.outerHTML+'<div class="noprint" style="text-align:center;margin-top:12px"><button class="btn" onclick="window.print()">طباعة / حفظ PDF</button></div></main></body></html>';
 var nm=(V.n==='inv'?S.i.find(function(x){return x.id===V.id}).no:'statement-'+today())+'.html';
 (window.claude?claude.use('downloads'):Promise.resolve(null)).then(function(dl){if(!dl)throw 0;return dl.save({filename:nm,data:html})}).then(function(){toast('تم حفظ الملف. افتحه من جهازك واضغط طباعة أو حفظ PDF.')}).catch(function(e){if(e===0){try{_pr.call(window)}catch(x){toast('الطباعة غير متاحة هنا')}}else toast('لم يتم حفظ الملف')});
};
draw();
</script>
<script>
var PM=[['inv','المبيعات والفواتير'],['cli','العملاء'],['sup','الموردين والمقاصة'],['acc','الحسابات والتحويلات'],['exp','المصروفات'],['hr','الموظفين والرواتب'],['rep','التقارير'],['set','الإعدادات والإقفال']];
function lv(m){if(!window.ME)return window.AUTH_ON?0:2;return ME.admin?2:+((ME.perms||{})[m]||0)}
var VM={hr:['hr',1],emp:['hr',1],slip:['hr',1],sal:['inv',1],new:['inv',2],inv:['inv',1],edit:['inv',2],stm:['cli',1],sst:['sup',1],acc:['acc',1],rep:['rep',1],set:['set',1]};
var _go=go;go=function(n,id){var m=VM[n];if(n==='cli'){if(lv('cli')<1&&lv('sup')<1)m=['cli',1];else{m=null;if(lv('cli')<1)CS='s'}}if(n==='acc'&&lv('acc')<1&&lv('exp')>=1){m=null;AS='x'}
 if(m&&lv(m[0])<m[1]){toast('ليس لديك صلاحية');return}_go(n,id)};
var FM={addCli:'cli',invForSup:'inv',saveCli:'cli',delCli:'cli',saveSup:'sup',delSup:'sup',setOpen:'cli',addSup:'sup',addBill:'sup',payBill:'sup',askDelB:'sup',doSetOff:'sup',doOff:'sup',delOff:'sup',addInv:'inv',addPay:'inv',askDel:'inv',saveSet:'set',saveAcc:'acc',delAcc:'acc',addAcc:'acc',addTr:'acc',addDep:'acc',addEx:'exp',delMv:'acc',addCat:'exp',renCat:'exp',delCat:'exp',addEmp:'hr',saveEmp:'hr',delEmp:'hr',addHr:'hr',delHr:'hr',genPay:'adm',payAll:'hr',payEmp:'hr',addLoan:'hr',repLoan:'hr',delLoan:'hr',approveMonth:'adm',doApprove:'adm',lockPay:'adm',unlockPay:'adm',setPst:'adm',delPr:'adm',purgeOrphans:'adm',doClose:'set',closeBtn:'set',doRestore:'set',backupBtn:'set'};
Object.keys(FM).forEach(function(n){var f=window[n];window[n]=function(){var m=FM[n];if(n==='delMv'&&arguments[0]==='e')m='exp';if(lv(m)<2){toast('ليس لديك صلاحية التعديل');return}return f.apply(this,arguments)}});
function applyNav(){var r={new:lv('inv')>=1,cli:lv('cli')>=1||lv('sup')>=1,acc:lv('acc')>=1||lv('exp')>=1,hr:lv('hr')>=1,rep:lv('rep')>=1,set:lv('set')>=1};Object.keys(r).forEach(function(k){var e=document.getElementById('n-'+k);if(e)e.style.display=r[k]?'':'none'})}
function onAuth(){applyNav();draw()}
function logout(){try{localStorage.removeItem('acc_tok');localStorage.removeItem(window.ACCK||'acc_sys1')}catch(e){}location.reload()}
var _hd=head;head=function(){_hd();if(window.ME){var e=document.getElementById('sy');if(e)e.insertAdjacentHTML('afterend','<span style="margin-inline-start:10px;white-space:nowrap"><button class="chip" onclick="pwBox()">🔑</button> <button class="chip" onclick="logout()">خروج · '+esc(ME.name||ME.u)+'</button></span>')}};
function pwBox(){var o=document.createElement('div');o.className='ov';o.innerHTML='<div class="ovb"><h2>تغيير كلمة السر</h2><label>الحالية</label><input id="pw0" type="password" dir="ltr"><label>الجديدة (6 أحرف على الأقل)</label><input id="pw1" type="password" dir="ltr"><div class="actions"><button class="btn" id="pwS">حفظ</button><button class="btn sec" id="pwX">إلغاء</button></div></div>';document.body.appendChild(o);
 o.querySelector('#pwX').onclick=function(){o.remove()};
 o.querySelector('#pwS').onclick=function(){authApi.call({action:'chpw',old:o.querySelector('#pw0').value,nw:o.querySelector('#pw1').value}).then(function(j){authApi.setToken(j.token);o.remove();toast('تم تغيير كلمة السر')}).catch(function(){toast('تعذر التغيير، تأكدي من كلمة السر الحالية')})}}
var UL=[],PRESETS={admin:null,acct:{inv:2,cli:2,sup:2,acc:2,exp:2,hr:2,rep:1,set:0},sales:{inv:2,cli:2,sup:0,acc:0,exp:0,hr:0,rep:0,set:0},view:{inv:1,cli:1,sup:1,acc:1,exp:1,hr:0,rep:1,set:0}};
function $e(i){return document.getElementById(i)}
function vUsers(){setTimeout(loadUsers,0);return'<div class="card"><h2>المستخدمون والصلاحيات</h2><div id="ulist" class="sub">جارٍ التحميل...</div><div id="uform"></div></div>'}
function loadUsers(){authApi.call({action:'users_list'}).then(function(j){UL=j.users;renderUsers()}).catch(function(){var e=$e('ulist');if(e)e.textContent='تعذر تحميل المستخدمين'})}
function renderUsers(){var e=$e('ulist');if(!e)return;e.innerHTML=UL.map(function(u,i){return'<div class="row"><div><b>'+esc(u.name||u.u)+'</b> <span class="sub">('+esc(u.u)+')</span><div class="sub">'+(u.admin?'مدير':'مستخدم')+(u.active?'':' · موقوف')+'</div></div><button class="btn sec" onclick="editUser('+i+')">تعديل</button></div>'}).join('')+'<div class="actions"><button class="btn" onclick="editUser(-1)">+ مستخدم جديد</button></div>'}
function editUser(i){var u=i>=0?UL[i]:{u:'',name:'',admin:false,perms:{},active:true},p=u.perms||{};
 var h='<h2 style="margin-top:14px">'+(i>=0?'تعديل المستخدم':'مستخدم جديد')+'</h2><label>اسم المستخدم (حروف إنجليزية وأرقام)</label><input id="uu" dir="ltr" value="'+esc(u.u)+'"'+(i>=0?' readonly':'')+'><label>الاسم</label><input id="un" value="'+esc(u.name)+'"><label>كلمة السر'+(i>=0?' (اتركيها فارغة بدون تغيير)':' (6 أحرف على الأقل)')+'</label><input id="up" type="password" dir="ltr" autocomplete="new-password"><label>نموذج جاهز</label><select id="ur" onchange="preset(this.value)"><option value="">— اختاري —</option><option value="admin">مدير (كل الصلاحيات)</option><option value="acct">محاسب</option><option value="sales">موظف مبيعات</option><option value="view">مشاهدة فقط</option></select><label><input id="ua" type="checkbox" style="width:auto" '+(u.admin?'checked':'')+'> مدير (يتحكم في المستخدمين)</label>';
 PM.forEach(function(m){var v=+p[m[0]]||0;h+='<div class="row"><span>'+m[1]+'</span><select id="pm_'+m[0]+'" style="width:auto"><option value="0"'+(v===0?' selected':'')+'>لا</option><option value="1"'+(v===1?' selected':'')+'>عرض</option><option value="2"'+(v===2?' selected':'')+'>تعديل</option></select></div>'});
 h+='<label><input id="ut" type="checkbox" style="width:auto" '+(u.active?'checked':'')+'> الحساب فعّال</label><div class="actions"><button class="btn" onclick="saveUsr()">حفظ</button>'+(i>=0?'<button class="btn sec" style="color:var(--bad);border-color:var(--bad)" onclick="delUsr(\''+esc(u.u)+'\')">حذف</button>':'')+'<button class="btn sec" onclick="$e(\'uform\').innerHTML=\'\'">إغلاق</button></div>';
 $e('uform').innerHTML=h}
function preset(k){var p=PRESETS[k];if(!k)return;$e('ua').checked=!p;PM.forEach(function(m){$e('pm_'+m[0]).value=p?p[m[0]]:2})}
function saveUsr(){var pr={};PM.forEach(function(m){pr[m[0]]=+$e('pm_'+m[0]).value});
 authApi.call({action:'user_save',u:{username:$e('uu').value.trim(),name:$e('un').value.trim(),password:$e('up').value,admin:$e('ua').checked,perms:pr,active:$e('ut').checked}}).then(function(){toast('تم الحفظ');$e('uform').innerHTML='';loadUsers()}).catch(function(e){var m=String(e.message);toast(m.indexOf('last_admin')>=0?'لازم يفضل مدير فعّال واحد على الأقل':m.indexOf('bad_user')>=0?'اسم المستخدم غير صالح أو كلمة السر أقل من 6 أحرف':'تعذر الحفظ')})}
function delUsr(n){authApi.call({action:'user_del',username:n}).then(function(){toast('تم الحذف');$e('uform').innerHTML='';loadUsers()}).catch(function(e){toast(String(e.message).indexOf('last_admin')>=0?'لا يمكن حذف آخر مدير أو حسابك الحالي':'تعذر الحذف')})}
var _vs=vSet;vSet=function(){return _vs()+(window.ME&&ME.admin?vUsers():'')};
</script>
